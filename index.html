<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文化祭くじ（1日目）</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fdf6ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
            position: relative;
        }
        h1 { color: #5c3a21; margin-bottom: 20px; font-size: 24px; }
        .qr-placeholder {
            width: 200px;
            height: 200px;
            background: #f5ebe0;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #5c3a21;
            font-weight: bold;
            font-size: 14px;
            color: #5c3a21;
        }
        .result-box { display: none; }
        .rank { font-size: 36px; font-weight: bold; color: #d35400; margin-bottom: 15px; animation: pop 0.5s ease; }
        .prize { font-size: 32px; font-weight: bold; color: #5c3a21; margin-bottom: 25px; }
        .timer { color: #747d8c; font-size: 14px; background: #f1f2f6; padding: 10px; border-radius: 10px; }
        
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 設定ボタンとモーダル */
        .settings-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #a4b0be;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            text-align: left;
        }
        .modal-content h3 { margin-top: 0; }
        .stock-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 18px; font-weight: bold; }
        .close-btn { background: #747d8c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        .reset-btn { background: #d35400; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 15px; float: right; }
    </style>
</head>
<body>

<div class="container">
    <button class="settings-btn" onclick="openSettings()">設定</button>

    <!-- 初期QR案内画面 -->
    <div id="qr-screen">
        <h1>次の方どうぞ！</h1>
        <div class="qr-placeholder">
            <span style="padding: 10px;">QRコードを<br>スキャンしてください</span>
        </div>
        <p style="color:#5c3a21; margin-bottom:20px;">スマホで読み込むと、結果が表示されます！</p>
    </div>

    <!-- 結果表示画面 -->
    <div id="result-screen" class="result-box">
        <h1>抽選結果</h1>
        <div class="rank">あたり！ 🍫</div>
        <div class="prize">チョコ棒</div>
        <div id="result-timer" class="timer">10秒後に画面が戻ります</div>
    </div>
</div>

<!-- 設定モーダル -->
<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>配布数カウント（1日目）</h3>
        <div class="stock-item"><span>配ったチョコ棒:</span> <span><span id="count-choco">0</span>本</span></div>
        <button class="close-btn" onclick="closeSettings()">閉じる</button>
        <button class="reset-btn" onclick="resetCount()">リセット</button>
    </div>
</div>

<script>
    let chocoCount = parseInt(localStorage.getItem('day1_choco_count')) || 0;
    let returnTimeout;
    let countdownInterval;

    function updateCountDisplay() {
        document.getElementById('count-choco').innerText = chocoCount;
        localStorage.setItem('day1_choco_count', chocoCount);
    }

    function openSettings() {
        updateCountDisplay();
        document.getElementById('settings-modal').style.display = 'flex';
    }
    function closeSettings() {
        document.getElementById('settings-modal').style.display = 'none';
    }
    function resetCount() {
        if(confirm('配った本数のカウントを0に戻しますか？')) {
            chocoCount = 0;
            updateCountDisplay();
        }
    }

    window.onload = function() {
        showChocoResult();
    };

    function showChocoResult() {
        chocoCount++;
        updateCountDisplay();

        document.getElementById('qr-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        let timeLeft = 10;
        document.getElementById('result-timer').innerText = `⚠️ ${timeLeft}秒後に画面が戻ります`;
        
        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            timeLeft--;
            if(timeLeft > 0) {
                document.getElementById('result-timer').innerText = `⚠️ ${timeLeft}秒後に画面が戻ります`;
            } else {
                clearInterval(countdownInterval);
            }
        }, 1000);

        clearTimeout(returnTimeout);
        returnTimeout = setTimeout(() => {
            backToQR();
        }, 10000);
    }

    function backToQR() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('qr-screen').style.display = 'block';
    }

    updateCountDisplay();
</script>
</body>
</html>
